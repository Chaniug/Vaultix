# Gradle / JVM
# 堆内存不要回退到 2g。Vaultix 含多个 Compose 模块 + Bitwarden 全载荷映射，
# Kotlin 编译器在分析大型 composable / 生成大段字节码（Compose 重启组）时易 OOM，
# 表现为"编译器过大无法编译"。16GB CI runner 与本地沙箱均足够，故 Gradle daemon
# 与 Kotlin 编译 daemon 各给 4g。若日后模块继续膨胀，优先上调此项而非加 -Xms。
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Kotlin 编译 daemon 独立 JVM 堆（旧值 ~2g，大模块编译会爆）。
# ReservedCodeCacheSize 提高以应对大型生成字节码（Compose 重启组代码膨胀）。
kotlin.daemon.jvmargs=-Xmx4g -XX:ReservedCodeCacheSize=512m -XX:+UseParallelGC

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official
