name: Android CI (Debug)

# 开发分支（main）的 debug 构建链路，参考 Bastion 的 main.yml：
#   - push / PR 到 main 时：编译并产出 Debug APK（最快出包路径）
#   - push 到 main 时：把 debug APK 发到 `preview` Release（prerelease），方便真机直接下载验证
#   - PR / 手动触发时：额外跑 Lint 作为质量门
#
# 稳定版走 release.yml（rele 分支 / v* tag / 手动），本工作流不负责正式发布。

on:
  push:
    branches: [ main ]
    paths:
      - '**/*.kt'
      - '**/*.java'
      - '**/*.xml'
      - '**/*.json'
      - '**/*.gradle'
      - '**/*.gradle.kts'
      - '**/*.kts'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      # 依赖版本目录与构建脚本改动同样会影响构建，必须纳入触发范围，
      # 否则修改它们后 CI 不运行，形成「改了却验证不到」的盲区。
      - '**/*.toml'
      - '**/*.sh'
      - '.github/scripts/**'
      - '.github/workflows/ci-debug.yml'
  pull_request:
    branches: [ main ]
    paths:
      - '**/*.kt'
      - '**/*.java'
      - '**/*.xml'
      - '**/*.json'
      - '**/*.gradle'
      - '**/*.gradle.kts'
      - '**/*.kts'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/workflows/ci-debug.yml'
  workflow_dispatch:

permissions:
  contents: write   # 发 debug APK 到 preview Release 需要

# 连续推送时新 run 排队而非取消旧 run：旧 run 跑完会把构建/配置缓存暖热，后续 run 命中缓存更快。
concurrency:
  group: android-ci-debug-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android-ci:
    name: Lint, test diagnostics, and debug build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GRADLE_OPTS: -Dorg.gradle.caching=true -Dorg.gradle.parallel=true -Dorg.gradle.configuration-cache=true -Dorg.gradle.configuration-cache.problems=warn
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 8.11.1
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          validate-wrappers: false

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 兜底：若仓库尚未提交 gradle-wrapper.jar（二进制），用 CI 安装的同版本 Gradle 现场生成 wrapper，
      # 保证 ./gradlew 始终可用。仓库补上真实 jar 后此步骤自动跳过。
      - name: Ensure gradle wrapper jar
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "::warning title=Missing wrapper jar::gradle-wrapper.jar 缺失，CI 现场生成（建议本地执行 'gradle wrapper' 后提交）。"
            gradle wrapper --gradle-version 8.11.1
          fi

      - name: Install Android SDK platform 36
        run: bash "$GITHUB_WORKSPACE/.github/scripts/ensure-android-sdk.sh"

      - name: Run lint
        if: github.event_name != 'push'
        # 多 flavor 下 `lintDebug` 存在歧义（候选：lintFullDebug / lintOfflineDebug），
        # 必须显式指定 variant；否则 PR / 手动触发时该步骤直接失败（push 时不跑 lint，故不易发现）。
        run: ./gradlew :app:lintFullDebug :app:lintOfflineDebug --stacktrace

      # push 时注入仓库固定签名，使 preview(debug) 与 stable release 签名完全一致、可互相覆盖安装。
      # 注意：本步骤与 release.yml 使用同一套 SIGNING_* Secret，密码也复用 Secret（不再硬编码 android），
      # 这是“同一设备 debug/release 覆盖安装”的硬性前提（同 applicationId + 同签名证书）。
      - name: Decode signing keystore
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -o pipefail
          KS="$GITHUB_WORKSPACE/release.jks"
          if [ -n "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" ]; then
            printf '%s' "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 -d > "$KS" 2>/tmp/b64.err || true
            if [ -s "$KS" ] && keytool -list -keystore "$KS" -storepass "${SIGNING_STORE_PASSWORD:-android}" -noprompt >/dev/null 2>&1; then
              echo "::notice title=signing::固定密钥解码并校验通过，将用于签名。"
            else
              echo "::warning title=Keystore invalid::SIGNING_KEYSTORE_BASE64 无效，改用一次性密钥仅验证流水线。"
              rm -f "$KS"
            fi
          fi
          if [ ! -s "$KS" ]; then
            echo "::warning title=No SIGNING_KEYSTORE_BASE64::未配置有效签名密钥，生成一次性密钥用于预览包。正式发布请配置 SIGNING_* Secrets。"
            KEYTOOL="$(command -v keytool || true)"
            if [ -z "$KEYTOOL" ] && [ -n "${JAVA_HOME:-}" ]; then
              KEYTOOL="$JAVA_HOME/bin/keytool"
            fi
            echo "::notice title=keytool path::${KEYTOOL:-<未找到>}"
            "$KEYTOOL" -genkeypair -v -keystore "$KS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -alias vaultix -keypass android -storepass android \
              -dname "CN=Vaultix Preview, O=Vaultix" 2>&1 || {
                echo "::error title=keytool failed::keytool 生成密钥失败，请检查 runner JDK/keytool 可用性。"
                exit 1
              }
          fi
          if [ ! -s "$KS" ]; then
            echo "::error title=Keystore decode failed::release.jks was not created or is empty."
            exit 1
          fi
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}

      - name: Build Debug APK (build gate)
        run: |
          set +e
          # 构建 full + offline 两个分发维度（见 Docs/11 的 flavor 定义）。
          # versionName 形如 0.1.0-dev-78db0ed：版本号 + dev 标识 + 短 commit SHA（可直接 git show 定位代码）。
          # 用 GITHUB_SHA 而非 git rev-parse：本 job 是 fetch-depth=1 浅克隆，本地 git 无历史，
          # 而 GITHUB_SHA 由 Actions 注入，不受克隆深度影响。
          KS_FILE="${{ github.event_name == 'push' && format('{0}/release.jks', github.workspace) || '' }}"
          KS_OPTS=""
          if [ -n "$KS_FILE" ]; then
            # 与 release.yml 完全一致的签名参数：store.password / key.alias / key.password 均复用 Secret
            # （缺省 android 仅用于“未配置 Secret”的兜底场景，此时无法与 release 互相覆盖）
            KS_OPTS="-Pandroid.injected.signing.store.file=$KS_FILE"
            KS_OPTS="$KS_OPTS -Pandroid.injected.signing.store.password=${SIGNING_STORE_PASSWORD:-android}"
            KS_OPTS="$KS_OPTS -Pandroid.injected.signing.key.alias=${SIGNING_KEY_ALIAS:-vaultix}"
            KS_OPTS="$KS_OPTS -Pandroid.injected.signing.key.password=${SIGNING_KEY_PASSWORD:-android}"
          fi
          ./gradlew :app:assembleFullDebug :app:assembleOfflineDebug --stacktrace \
            -PversionName="0.1.0-dev-$(echo ${GITHUB_SHA} | cut -c1-7)" $KS_OPTS 2>&1 | tee /tmp/build_log.txt
          BUILD_EXIT=${PIPESTATUS[0]}
          if [ "$BUILD_EXIT" -ne 0 ]; then
            echo "::notice title=Build gate diagnostics::build_failed=true"
            grep -E "^e: |error:|FAILURE|Caused by:|Could not|What went wrong|BUILD FAILED" /tmp/build_log.txt | head -40 | while IFS= read -r line; do
              echo "::notice title=build_gate::$line"
            done
            exit "$BUILD_EXIT"
          fi
          echo "::notice title=Build gate diagnostics::build_failed=false"

      - name: List debug APK outputs
        run: find app/build/outputs/apk/*/debug -maxdepth 1 -type f -print || true

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: debug-apk
          path: |
            app/build/outputs/apk/*/debug/*.apk
            app/build/outputs/apk/*/debug/*.APK
          if-no-files-found: error
          retention-days: 3

      - name: Collect debug APK metadata
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: apk_meta
        shell: bash
        run: |
          # 多 flavor（full / offline）下 `cd app/build/outputs/apk/*/debug` 会被展开成多个
          # 目录，导致 "cd: too many arguments"。改为从 apk 根目录统一查找，不进入子目录，
          # 这样两个 flavor 的产物都能被收集到。
          apk_root="app/build/outputs/apk"
          apk_list="$(find "$apk_root" -type f \( -iname '*.apk' -o -iname '*.APK' \) -printf '%P\n' | sort)"
          apk_count="$(printf '%s\n' "$apk_list" | sed '/^$/d' | wc -l | tr -d ' ')"
          if [ "$apk_count" = "0" ]; then
            echo "No debug APK found under $apk_root"
            find "$apk_root" -maxdepth 3 2>/dev/null || true
            exit 1
          fi
          apk_markdown="$(printf '%s\n' "$apk_list" | sed '/^$/d' | sed 's/^/> *   `/; s/$/`/')"
          echo "apk_count=${apk_count}" >> "$GITHUB_OUTPUT"
          {
            echo "apk_list<<EOF"
            printf '%s\n' "$apk_markdown"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Cleanup previous preview release (assets + release + tag)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          release_id="$(gh api repos/${{ github.repository }}/releases/tags/preview --jq '.id' 2>/dev/null || true)"
          if [[ "$release_id" =~ ^[0-9]+$ ]]; then
            echo "Deleting existing preview release id=${release_id}"
            gh api -X DELETE repos/${{ github.repository }}/releases/${release_id} 2>/dev/null || true
          else
            echo "No existing preview release to delete"
          fi
          gh api -X DELETE repos/${{ github.repository }}/git/refs/tags/preview 2>/dev/null || true
          echo "Cleanup done"

      - name: Publish Debug APK to preview Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: preview
          target_commitish: ${{ github.sha }}
          name: "⚠️ Development Preview (dev-${{ github.sha }})"
          body: |
            > **⚠️ 开发预览版本 (Debug APK)**
            >
            > 此版本为 debug 构建产物，用于快速体验最新代码，可能包含未完成功能或 Bug。
            > 正式使用请下载 Stable 版本（rele 分支发布）。
            > ---
            > **构建信息：**
            > * **Build Type**: `debug`
            > * **Commit SHA**: `${{ github.sha }}`
            > * **Ref**: `${{ github.ref }}`
            > **Generated APKs:**
            ${{ steps.apk_meta.outputs.apk_list }}
          files: |
            app/build/outputs/apk/*/debug/*.apk
            app/build/outputs/apk/*/debug/*.APK
          draft: false
          prerelease: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run unit tests (non-blocking)
        id: unit_tests
        continue-on-error: true
        # 同 lint：多 flavor 下 `testDebugUnitTest` 亦有歧义，需显式指定 variant。
        # 同时把 core:crypto 的单元测试（172 例，Kover 门禁 ≥80%）纳入 CI 验证——
        # 此前只跑 :app 的测试，而 :app 当时并无用例，等于单测从未在 CI 真正执行。
        run: ./gradlew :core:crypto:testDebugUnitTest :app:testFullDebugUnitTest --continue --stacktrace

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: debug-unit-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/test-results/testDebugUnitTest
          if-no-files-found: ignore
          retention-days: 3
