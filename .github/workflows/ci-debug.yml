name: Android CI (Debug)

# 开发分支（main）的 debug 构建链路，参考 Bastion 的 main.yml：
#   - push / PR 到 main 时：编译并产出 Debug APK（最快出包路径）
#   - push 到 main 时：把 debug APK 发到 `preview` Release（prerelease），方便真机直接下载验证
#   - PR / 手动触发时：额外跑 Lint 作为质量门
#
# 稳定版走 release.yml（rele 分支 / v* tag / 手动），本工作流不负责正式发布。

on:
  push:
    branches: [ main ]
    paths:
      - '**/*.kt'
      - '**/*.java'
      - '**/*.xml'
      - '**/*.json'
      - '**/*.gradle'
      - '**/*.gradle.kts'
      - '**/*.kts'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      # 依赖版本目录与构建脚本改动同样会影响构建，必须纳入触发范围，
      # 否则修改它们后 CI 不运行，形成「改了却验证不到」的盲区。
      - '**/*.toml'
      - '**/*.sh'
      - '.github/scripts/**'
      # ★ 2026-10-31：原只列了 ci-debug.yml 自己 —— 改 **release.yml** 不触发任何验证，
      #   而它里面是有手写 shell 的（Generate changelog 的取值分支）。
      #   「改了发布逻辑却在 CI 里看不到」是比多跑一次更贵的问题。
      - '.github/workflows/**'
      - 'config/**'
      # ★ 2026-11-01：`paths` 里没有 `.ai/tools/**` ⇒ 只改自检脚本时 **整个 CI 都不跑**。
      #   实测：提交 6bccb9d（只动了 read_apk_signer.py / selftest_apk_signer.py 与文档）
      #   **没有触发任何 run**，等了十分钟才发现 —— 而这几个脚本本身是 CI 的门禁。
      #   「改门禁 → 门禁不跑 → 以为门禁通过」比门禁缺失更危险：它给的是**假的绿灯**。
      - '.ai/tools/**'
  pull_request:
    branches: [ main ]
    paths:
      - '**/*.kt'
      - '**/*.java'
      - '**/*.xml'
      - '**/*.json'
      - '**/*.gradle'
      - '**/*.gradle.kts'
      - '**/*.kts'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/scripts/**'
      - '.github/workflows/**'
      - 'config/**'
      # ★ 2026-11-01：`paths` 里没有 `.ai/tools/**` ⇒ 只改自检脚本时 **整个 CI 都不跑**。
      #   实测：提交 6bccb9d（只动了 read_apk_signer.py / selftest_apk_signer.py 与文档）
      #   **没有触发任何 run**，等了十分钟才发现 —— 而这几个脚本本身是 CI 的门禁。
      #   「改门禁 → 门禁不跑 → 以为门禁通过」比门禁缺失更危险：它给的是**假的绿灯**。
      - '.ai/tools/**'
  workflow_dispatch:

permissions:
  contents: write   # 发 debug APK 到 preview Release 需要

# 连续推送时新 run 排队而非取消旧 run：旧 run 跑完会把构建/配置缓存暖热，后续 run 命中缓存更快。
concurrency:
  group: android-ci-debug-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android-ci:
    name: Lint, test diagnostics, and debug build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GRADLE_OPTS: -Dorg.gradle.caching=true -Dorg.gradle.parallel=true -Dorg.gradle.configuration-cache=true -Dorg.gradle.configuration-cache.problems=warn
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # ⚠️ 不要在这里写 `gradle-version:`（2026-10-02 移除，见 .ai/ISSUES.md #145.3）。
      # 原本写死 `gradle-version: 8.11.1`，而 `gradle-wrapper.properties` 是 9.5.1，
      # 于是 CI 里**同时存在两个 Gradle**：setup-gradle 把 8.11.1 provision 到
      # `/home/runner/work/_temp/.gradle-actions/`，而本 workflow 所有构建命令都用
      # `./gradlew` ⇒ **实际跑的是 wrapper 的 9.5.1**。三个后果：
      #   ① 8.11.1 白下载白解压（每次约 10s，还占一条缓存条目）；
      #   ② setup-gradle 的缓存按 Gradle 版本分区 ⇒ provision 的 8.11.1 缓存
      #      对实际构建的 9.5.1 **一点用都没有**（日志里 "Cache hit for: gradle-8.11.1"
      #      看着像命中了，其实命中的是个没人用的版本）；
      #   ③ **最危险**：哪天有人把 `./gradlew` 改成 `gradle`（用 setup-gradle 装的那个），
      #      构建会**静默从 9.5.1 掉到 8.11.1** —— 一次无声的版本分叉。
      # ⇒ `gradle/actions/setup-gradle` 默认就是「用仓库 wrapper 声明的版本」，
      #   不指定即正确，且**版本只有一个来源**（wrapper properties），天然不会分叉。
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          # validate-wrappers 默认 true（校验 wrapper jar 的 checksum，防供应链篡改）。
          # 这里保持 false：仓库的 gradle-wrapper.jar 是手工提交进来的，未经官方
          # checksum 校验流程登记；若改回 true 需先确认 jar 与 properties 版本一致。
          validate-wrappers: false

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 兜底：若仓库尚未提交 gradle-wrapper.jar（二进制），现场生成 wrapper，保证 ./gradlew 可用。
      # 仓库已补上真实 jar（2026-10-01），此步骤自动跳过。
      # ⚠️ 版本**从 properties 读**，不要写死（原本写死 8.11.1）：
      #    jar 丢了时若生成 8.11.1，而 properties 仍写 9.5.1 ⇒ 生成的 wrapper 与
      #    声明的版本分叉，下一次 ./gradlew 会去下载另一个版本、且无人察觉。
      #    ⇒ 与 #125.1 同一个思路：**让版本只有一个来源**。
      - name: Ensure gradle wrapper jar
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "::warning title=Missing wrapper jar::gradle-wrapper.jar 缺失，CI 现场生成（建议本地执行 'gradle wrapper' 后提交）。"
            # ⚠️ 分隔符必须用 `#`：用 `|` 时，正则里的 `(bin|all)` 会让 sed 认为
            #    `s` 命令提前结束并报 `unknown option to 's'`（2026-10-02 实测踩到）。
            gwv="$(sed -nE 's#^distributionUrl=.*/gradle-([0-9][0-9.]*)-(bin|all)\.zip$#\1#p' gradle/wrapper/gradle-wrapper.properties)"
            if [ -z "$gwv" ]; then
              echo "::error title=Unresolvable Gradle version::无法从 gradle-wrapper.properties 解析版本，拒绝猜测。"
              exit 1
            fi
            echo "按 gradle-wrapper.properties 生成 wrapper：$gwv"
            gradle wrapper --gradle-version "$gwv"
          fi

      - name: Install Android SDK platform 36
        run: bash "$GITHUB_WORKSPACE/.github/scripts/ensure-android-sdk.sh"

      - name: Run lint
        if: github.event_name != 'push'
        # ⚠️ 2026-09-15：这是本步骤**历史上第一次真正执行**，一执行就红（run 34920991273）。
        # 原因：条件 `event != 'push'` 使它在 push 链路永远跳过，而本仓库此前 50 次运行
        # **全是 push** ⇒ 这条门禁**从未被验证过**，是否可用无人知道。
        # 而它失败会 **skip 掉 detekt / 编码检查 / Build Debug APK** ——
        # 一个未验证的门把三条真门禁全堵死。故先加 `continue-on-error` 止血：
        # **只报告、不阻断**，等查明是"Gradle 8.11.1 与 AGP 不兼容"还是真有 lint 违例
        # （见 `.ai/ISSUES.md` #100）再决定去留。⛔ 在取证完成前不要删这个 `if`，
        # 也不要放宽 lint 规则 —— 那两种改法都是在没搞清削弱了什么的前提下动门禁。
        continue-on-error: true
        # 多 flavor 下 `lintDebug` 存在歧义（候选：lintFullDebug / lintOfflineDebug），
        # 必须显式指定 variant；否则 PR / 手动触发时该步骤直接失败（push 时不跑 lint，故不易发现）。
        # 2026-09-09：只 lint full —— offline flavor 暂停参与构建（见下方 build 步骤注释），
        # 对它跑 lint 无意义。恢复 offline 时同步加回 :app:lintOfflineDebug。
        # 注意：AGP 的 LintModelWriterTask 与 Gradle 配置缓存不兼容，会抛
        # ConfigurationCacheError（并连带导致 androidTest classpath 解析失败）。
        # CI 的 GRADLE_OPTS 全局开启了 configuration-cache，故此处显式关闭。
        run: ./gradlew :app:lintFullDebug --stacktrace --no-configuration-cache

      # Detekt 质量门禁（P1，Docs/16 代码规模纪律）：push / PR 均执行。
      # 规则阈值在 config/detekt/detekt.yml；同 lint 用 --no-configuration-cache 规避
      # AGP/Worker API 与配置缓存的兼容坑（见上一条 lint 注释）。
      - name: Run detekt (quality gate)
        run: ./gradlew detekt --stacktrace --no-configuration-cache

      # 源文件编码门禁（2026-09-08 加）：拦住中文注释乱码「静默入库」。
      # 事故背景：BitwardenAuthRepository.kt 曾整文件被写坏——UTF-8 字节被按 GBK
      # 误读后再次存盘，且三字节序列的尾字节被 0x3F 替换（有损，无法自动还原）。
      # 编译与测试都不检查注释，损坏因此悄悄进了仓库，直到人工阅读才发现。
      # 脚本判据经过校准，不会把「为」「状态」「值」等正常中文误判为乱码。
      - name: Check source encoding (UTF-8 / mojibake gate)
        run: python3 "$GITHUB_WORKSPACE/.github/scripts/check-encoding.py" "$GITHUB_WORKSPACE"

      # ★ 2026-11-01：版本号口径自测（本文件里那段 awk vs Kotlin `versionCodeOf()`）。
      #
      # 为什么要在 CI 里跑：它校验的是**本文件自己**的那段 awk。改文案时顺手动了它、
      # 本地却没跑 —— 结果只是 Release 页上写错一个数字，包本身完全正常，
      # 没人会发现（除了几个月后拿着版本号对不上的人）。
      # 它自带"找不到 Kotlin 编译器就 SKIP"的降级，不会因基础设施问题判红。
      - name: Self-test version code parity (workflow awk vs Kotlin)
        shell: bash
        run: python3 "$GITHUB_WORKSPACE/.ai/tools/tests/selftest_version_code.py"

      # ★ 2026-11-01：workflow 里「两条语句被写成一行」的静默错误。
      #
      # 事故（就是本文件）：给 Release 页面加签名指纹时，`else` 分支的两条 `echo` 被写成了一行，
      # `bash -n` 判合法、CI #340 全绿、页面照常生成 —— 只是「签名」那行印出
      # `SHA-256 echo signer_subject=unknown`。**没有任何门禁会因此变红**，
      # 唯一发现途径是去打开页面看。⇒ 补一个能提前抓住它的检查。
      - name: Check workflow shell (swallowed statements)
        shell: bash
        run: python3 "$GITHUB_WORKSPACE/.ai/tools/check_workflow_shell.py"

      # ★ 2026-11-01：Secret 变量「引用了但没注入」的检查。
      #
      # 同一句教训踩了两遍：2026-09-08 在 `Decode signing keystore` 上，2026-11-01 又在
      # `Build Debug APK` 上。后者更糟 —— 它打出一条**假的** `Keystore store password wrong`，
      # 与上一步的「解码通过」互相矛盾，等于把 #218.1 想修的误诊又造了一遍。
      # `${VAR:-android}` 语法永远合法、`bash -n` 永远通过；缺陷在 YAML 层，只能跨文件比对。
      - name: Check workflow secret env (referenced but never injected)
        shell: bash
        run: python3 "$GITHUB_WORKSPACE/.ai/tools/check_workflow_secret_env.py" "$GITHUB_WORKSPACE"

      # ★ 2026-11-01：APK 签名块解析器的自检。
      # 为什么非要有：`apksigner` 不在 runner 的 PATH 上，能用的只有我们自己写的
      # `.ai/tools/read_apk_signer.py`。它一旦静默读错，Release 页的「签名」就永远显示
      # 「未能读取」—— 而这一整块功能存在的意义，恰恰是让人能一眼看出包是谁签的。
      # 自检现场生成证书、拼一个符合 v2 结构的 APK，断言指纹与证书 SHA-256 逐字节相等。
      - name: Self-test APK signer parser (v2 signature block)
        shell: bash
        run: python3 "$GITHUB_WORKSPACE/.ai/tools/tests/selftest_apk_signer.py"

      # ★ 2026-11-01：签名变量名跨文件核对。
      #
      # 事故（用户报「最新安装包与本机上一个 dev 包签名不一致」）：
      #   workflow 把密钥以 `-Pandroid.injected.signing.*` + `SIGNING_*` 交给构建，
      #   而 `app/build.gradle.kts` 只认 `VAULTIX_*` ⇒ `hasReleaseSigning == false`
      #   ⇒ debug 包一直用**一次性 debug key** 签。
      #   最要命的是**没有任何一处报错**：`keytool -certreq` 校验真的通过（密钥没问题）、
      #   构建真的成功（debug 签名总会成功），两句话都是对的，只有包里的证书不对。
      # ⇒ 变量名对不对，只能靠跨文件比对，不能靠读代码"确认"。
      - name: Check signing var names (workflow vs gradle)
        shell: bash
        run: python3 "$GITHUB_WORKSPACE/.ai/tools/check_signing_var_names.py" "$GITHUB_WORKSPACE"

      # 同上一步的自检：这条门禁目前是绿的，而"绿"必须能被证明是"检查在工作"，
      # 不是"检查根本没在检查"。自检造两个临时仓库（断链 / 接通）分别要求 rc=1 / rc=0。
      - name: Self-test signing var name checker
        shell: bash
        run: python3 "$GITHUB_WORKSPACE/.ai/tools/tests/selftest_signing_var_names.py"

      # ★ 2026-11-01（#221）：发布产物清单的键是否真的存在。
      #
      # 事故：`Publish Debug APK to preview Release` 结论绿、日志里没有一句
      # `Uploading asset`、Release 页 `assets=0` —— 用户看到「最新 dev 构建没出 APK」。
      # 根因是 `files: |` 被粘在了 `body:` 末行末尾：YAML 完全接受（它就是一段更长的
      # 正文），而 `with.files` 这个键**不存在**，action 走了「没有 files」的分支。
      #
      # 这类错没有任何运行时信号：bash 过、yaml 过、action success、Release 页也确实更新了。
      - name: Check release assets (files key not swallowed by body)
        shell: bash
        run: python3 "$GITHUB_WORKSPACE/.ai/tools/check_release_assets.py" "$GITHUB_WORKSPACE"

      - name: Self-test release assets checker
        shell: bash
        run: python3 "$GITHUB_WORKSPACE/.ai/tools/tests/selftest_release_assets.py"

      # push 时注入仓库固定签名，使 preview(debug) 与 stable release 签名完全一致、可互相覆盖安装。
      # 注意：本步骤与 release.yml 使用同一套 SIGNING_* Secret，密码也复用 Secret（不再硬编码 android），
      # 这是“同一设备 debug/release 覆盖安装”的硬性前提（同 applicationId + 同签名证书）。
      # ⚠️ 2026-09-08 修复：GitHub Secrets 不会自动变成环境变量，此前 ${SIGNING_STORE_PASSWORD}
      #    恒为空 → 回落 android → keytool 校验必失败 → 每次构建都用一次性密钥（无法覆盖安装）。
      #    现在通过 step env 显式注入，decode 校验与 build 签名使用同一份密码。
      - name: Decode signing keystore
        # ⚠️ 2026-09-12：原先只在 push 时解码固定密钥 ⇒ **手动 workflow_dispatch 产出的包
        #    是用 runner 上现生成的一次性 debug key 签的**（每台 runner 全新 ⇒ 每次密钥都不同），
        #    既盖不上 preview 包、彼此也盖不上 ⇒ 用户只能卸载重装 ⇒ **数据与 AndroidKeyStore
        #    条目一起消失**（表现就是「覆盖安装后指纹解锁被清除、且重开也开不回来」）。
        #    PR（含 fork）拿不到 Secret，仍走下面的兜底分支，行为不变。
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -o pipefail
          KS="$GITHUB_WORKSPACE/release.jks"
          if [ -n "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" ]; then
            printf '%s' "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 -d > "$KS" 2>/tmp/b64.err || true
            if [ -s "$KS" ] && keytool -list -keystore "$KS" -storepass "${SIGNING_STORE_PASSWORD:-android}" -noprompt >/dev/null 2>&1; then
              # ⚠️ 2026-11-01：「校验通过」这句**只说了一半** —— `keytool -list` 只验
              #    store 密码，**不验 key 密码**。key 密码不一致时这里照样打"通过"，
              #    而打包阶段会报 `keystore password was incorrect`。
              #    真正的两样校验在 `Build Debug APK` 步骤的开头（`keytool -certreq`）。
              echo "::notice title=signing::固定密钥解码通过（仅 store 密码；key 密码在打包步骤前再验）"
            else
              echo "::warning title=Keystore invalid::SIGNING_KEYSTORE_BASE64 无效，改用一次性密钥仅验证流水线。"
              rm -f "$KS"
            fi
          fi
          if [ ! -s "$KS" ]; then
            echo "::warning title=No SIGNING_KEYSTORE_BASE64::未配置有效签名密钥，生成一次性密钥用于预览包。正式发布请配置 SIGNING_* Secrets。"
            KEYTOOL="$(command -v keytool || true)"
            if [ -z "$KEYTOOL" ] && [ -n "${JAVA_HOME:-}" ]; then
              KEYTOOL="$JAVA_HOME/bin/keytool"
            fi
            echo "::notice title=keytool path::${KEYTOOL:-<未找到>}"
            "$KEYTOOL" -genkeypair -v -keystore "$KS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -alias vaultix -keypass android -storepass android \
              -dname "CN=Vaultix Preview, O=Vaultix" 2>&1 || {
                echo "::error title=keytool failed::keytool 生成密钥失败，请检查 runner JDK/keytool 可用性。"
                exit 1
              }
          fi
          if [ ! -s "$KS" ]; then
            echo "::error title=Keystore decode failed::release.jks was not created or is empty."
            exit 1
          fi
        env:
          # ⚠️ 2026-09-08 修复：Secrets 需显式注入 env，否则 ${SIGNING_STORE_PASSWORD}
          #    恒为空回落 android，keytool 校验必失败 → 一次性密钥（无法覆盖安装）
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          GITHUB_WORKSPACE: ${{ github.workspace }}

      - name: Build Debug APK (build gate)
        run: |
          set +e
          # 只构建 full 分发。offline（仅 KDBX 本地库）**暂停参与构建**（2026-09-09 用户拍板）：
          # KDBX 引擎（data:kdbx）属 P3 待办，现在出 offline 包是空壳；且双 variant 编译
          # 让 CI 时间/缓存空间翻倍。flavor 定义与 AppFlavor 分支代码保留在仓库中，
          # 待 Bitwarden 收尾、决定是否做纯本地版时再恢复（届时加回
          # :app:compileOfflineDebugKotlin / lintOfflineDebug / assembleOfflineRelease）。
          # versionName 形如 0.3.0-dev-78db0ed：**VERSION 文件的基号** + dev 标识 + 短 commit SHA
          # （可直接 git show 定位代码）。
          # ⚠️ 基号必须读 VERSION，不能硬编码。此前写死 `0.1.0-dev-<sha>`，于是 debug 包在
          # 设置页显示 0.1.0、而代码其实是 0.3.0 —— 与 build.gradle.kts「本地构建 / 设置页
          # 显示 / VERSION 文件三处同源」的承诺冲突，排查时极易误判手上装的是哪一版
          # （2026-09-14 用户报告「版本号看着不对」时发现）。
          # 用 GITHUB_SHA 而非 git rev-parse：本 job 是 fetch-depth=1 浅克隆，本地 git 无历史，
          # 而 GITHUB_SHA 由 Actions 注入，不受克隆深度影响。
          # 固定密钥是否可用由**磁盘上是否存在 release.jks** 决定（解码步骤已保证它来自
          # 仓库 Secret），不再按事件名判断 —— 否则 workflow_dispatch 包会退回一次性密钥、
          # 无法覆盖安装（数据 + Keystore 全丢）。
          #
          # ★ 2026-11-01：先**真的验一次 key 密码**，验不过就退一次性密钥，**不要**带着坏密码去打包。
          #
          # 事故：CI #332/#333/#334/#335 连续四次红，报错落在
          #   `:app:packageFullDebug` →
          #   `KeytoolException: Failed to read key *** from store "release.jks":
          #    keystore password was incorrect`。
          # 而上面的「Decode signing keystore」明明打着
          #   `固定密钥解码并校验通过，将用于签名。`
          # —— 因为那句校验用的是 `keytool -list`，**它只验 store 密码，不验 key 密码**。
          # 两种密码不一致时：解码步骤报"通过"、打包步骤报"密码错"，两句日志互相矛盾，
          # 人被引去找代码问题（Compose 规则、编译错误），连查两轮都没中。
          #
          # ⇒ 校验必须覆盖打包真正用到的**两样**。`keytool -certreq` 会真的解一次私钥，
          #   key 密码错时立刻失败 —— 这才是与打包等效的校验。
          #   验不过就删掉固定密钥、走一次性密钥：宁可出一个"盖不上旧包"的预览包，
          #   也不要一个**根本打不出来**的包。
          KS_FILE="$GITHUB_WORKSPACE/release.jks"
          if [ -s "$KS_FILE" ] && ! keytool -certreq -keystore "$KS_FILE" \
              -storepass "${SIGNING_STORE_PASSWORD:-android}" \
              -alias "${SIGNING_KEY_ALIAS:-vaultix}" \
              -keypass "${SIGNING_KEY_PASSWORD:-android}" >/dev/null 2>&1; then
            # ★ 2026-11-01：**把失败原因分清楚**。此前只有一句「key 密码不一致」，而实际有两种
            #   完全不同的病因，修法也不同：
            #     ① key 密码与 store 密码不同（Java 9+ 允许 PKCS12 的 key/store 密码不同）
            #        ⇒ 改 SIGNING_KEY_PASSWORD 即可；
            #     ② **Secret 里的 keystore 根本不是"本机那把"**（换过密钥 / 传错文件）
            #        ⇒ 改密码永远修不好，必须先认出这一点。
            #   现场再验一次"仅 store 密码能否列出条目 + 证书指纹是什么"，就能区分：
            #     · -list 也过不了 ⇒ store 密码错（连库都打不开）；
            #     · -list 过了 ⇒ 库能开、指纹可读 ⇒ 只需对齐 key 密码。
            #   指纹是判定 ② 的唯一硬证据：跟设备上已装包的证书指纹一比即知。
            if keytool -list -keystore "$KS_FILE" -storepass "${SIGNING_STORE_PASSWORD:-android}" -noprompt >/dev/null 2>&1; then
              # ⚠️ 必须 `[[:space:]]*` 而不是 ` *`：keytool 在 `SHA256:` 后跟的是**制表符**，
              #    用 `tr -d ' '` 删不掉它 ⇒ 指纹会带着一个不可见前缀（本地实测踩到）。
              ks_fp="$(keytool -list -v -keystore "$KS_FILE" \
                  -storepass "${SIGNING_STORE_PASSWORD:-android}" \
                  -alias "${SIGNING_KEY_ALIAS:-vaultix}" -noprompt 2>/dev/null \
                | sed -nE 's/.*SHA256:[[:space:]]*//p' | head -1 | tr -d '[:space:]' | tr 'A-F' 'a-f')"
              echo "::warning title=Keystore key password invalid::固定密钥库可打开（store 密码正确），但 key 密码解不开私钥 ⇒ 本包改用一次性密钥、**无法覆盖安装**。修法：把 SIGNING_KEY_PASSWORD 改成与 store 密码相同（或改成 key 的真实密码）。本次已解码密钥的证书指纹：${ks_fp:-<读取失败>}"
            else
              # ⚠️ 2026-11-01 二次踩坑：这条**曾经是假的**（CI #341）。真因是本步骤缺 `env:`
              #    ⇒ `SIGNING_STORE_PASSWORD` 恒空 ⇒ 回落 `android` ⇒ 必然打不开。
              #    现在本步骤已显式注入三个 SIGNING_* env；同时把「Secret 到底有没有配」
              #    写进告警里 —— 空值导致的误诊不该再靠人去比对另一条日志才能识破。
              echo "::error title=Keystore store password wrong::固定密钥库连 store 密码都打不开 ⇒ SIGNING_STORE_PASSWORD 与 keystore 不符。本次改用一次性密钥（无法覆盖安装）。诊断：SIGNING_STORE_PASSWORD ${SIGNING_STORE_PASSWORD:+已配置（${#SIGNING_STORE_PASSWORD} 字符）}${SIGNING_STORE_PASSWORD:-未配置，已回落 android}；SIGNING_KEY_PASSWORD ${SIGNING_KEY_PASSWORD:+已配置}${SIGNING_KEY_PASSWORD:-未配置，已回落 android}；SIGNING_KEY_ALIAS=${SIGNING_KEY_ALIAS:-未配置，已回落 vaultix}"
            fi
            rm -f "$KS_FILE"
          fi
          if [ ! -s "$KS_FILE" ]; then KS_FILE=""; fi
          KS_OPTS=""
          if [ -n "$KS_FILE" ]; then
            # ★ 2026-11-01：这里**只**给 `-Pandroid.injected.signing.*` 是不够的。
            #
            # 事故（用户报「最新安装包与本机上一个 dev 包签名不一致」）：
            #   `app/build.gradle.kts` 的签名配置**从不读** `android.injected.signing.*`，
            #   它读的是环境变量 `VAULTIX_*`（后来已改为同时认 `SIGNING_*`）。
            #   于是 `hasReleaseSigning == false` ⇒ **debug 包用 Android 一次性 debug key 签**。
            #   同一份日志里：本步骤的 `keytool -certreq` 校验**真的通过**、构建**真的成功** ——
            #   没有一句错话，只有包里的证书不是那把密钥的。
            # ⇒ 现在密钥路径/密码/别名**同时以环境变量下发**（见本步骤 `env:`），
            #   gradle 侧按 `SIGNING_*` → `VAULTIX_*` 的顺序命中。
            #   两套都给，是为了让"改名"这件事不再需要同时改两个文件（那正是本轮的病根）。
            #
            # ⚠️ `-Pandroid.injected.signing.*` **保留不动**：AGP 官方通道，若将来 gradle
            #    侧改回由 AGP 接管，它仍然生效；且删掉它属于"顺手清理"，没有收益只有风险。
            KS_OPTS="-Pandroid.injected.signing.store.file=$KS_FILE"
            KS_OPTS="$KS_OPTS -Pandroid.injected.signing.store.password=${SIGNING_STORE_PASSWORD:-android}"
            KS_OPTS="$KS_OPTS -Pandroid.injected.signing.key.alias=${SIGNING_KEY_ALIAS:-vaultix}"
            KS_OPTS="$KS_OPTS -Pandroid.injected.signing.key.password=${SIGNING_KEY_PASSWORD:-android}"
            # 与上面同一个值，但走 gradle 真正会读的那条通道。
            export VAULTIX_KEYSTORE_PATH="$KS_FILE"
            export VAULTIX_STORE_PASSWORD="${SIGNING_STORE_PASSWORD:-android}"
            export VAULTIX_KEY_ALIAS="${SIGNING_KEY_ALIAS:-vaultix}"
            export SIGNING_KEYSTORE_PATH="$KS_FILE"
            echo "::notice title=signing::密钥已下发（env VAULTIX_* / SIGNING_* + -Pandroid.injected.signing.*）"
          else
            echo "::warning title=signing::本次**没有**可用固定密钥 ⇒ debug 包将用一次性密钥签名，**无法覆盖安装**已有包。"
          fi
          # 基号取 VERSION（真源）；读不到就退 0.0.0 保证构建不中断。
          BASE_VERSION="$(tr -d '[:space:]' < "$GITHUB_WORKSPACE/VERSION" 2>/dev/null)"
          if [ -z "$BASE_VERSION" ]; then BASE_VERSION="0.0.0"; fi
          # ★ 2026-11-01：把这次 build 的两个版本字段**落盘**（`$GITHUB_WORKSPACE`，不是 /tmp）。
          #
          # 为什么要落盘而不是让后面的步骤自己再算一遍：versionName 的拼法一旦出现两处，
          # 迟早有一处没跟上（本仓库 #145.1「让版本只有一个来源」就是为此）。
          # 落盘后，`Collect debug APK metadata` 只读不猜。
          #
          # versionCode 的口径必须与 `app/build.gradle.kts` 的 `versionCodeOf()` **逐字一致**：
          #   `X.Y.Z[-后缀]` → X*1_000_000 + Y*1_000 + Z（给 minor/patch 各留三位）；
          #   任一段不是非负整数 → 1（Kotlin 侧是 `toIntOrNull() ?: return 1`）。
          #   两边不一致的后果很隐蔽 —— 只是 Release 页上写错一个数字，包本身没事。
          #
          # ⚠️ 这段 awk **不是照抄逻辑，是拿真编译器对过账的**（2026-11-01）：
          #   `.ai/tools/tests/selftest_version_code.py` 把 `versionCodeOf()` 原样抽出来
          #   真编译运行，与本 awk 逐例比对（当前 16 例，已接入 CI）。
          #   写这条注释是因为它已经踩过两次：
          #     • `${name%%-*}` 会把 `-1.0.0` 截成空串（负号被当后缀分隔符）⇒ awk 拿到空输入、无输出；
          #     • `isnum` 写成 `^-?[0-9]+$`，而 Kotlin 的 `toIntOrNull()` **接受 `+4`**
          #       ⇒ `0.10.+4` 两边算出 10000 / 10004。**这一条是测试抓出来的，不是读出来的。**
          #   ⇒ 「口径一致」不能靠读代码确认，只能靠跑；而"跑了"还得先证明这个跑是有效的
          #     （第一版 14 条用例里，三种故意改坏照样全绿）。
          DEV_VERSION_NAME="${BASE_VERSION}-dev-$(echo ${GITHUB_SHA} | cut -c1-7)"
          VC_BASE="${BASE_VERSION%%-[0-9A-Za-z]*}"
          # 最短匹配会把 `-1.0.0` 整个吃掉 ⇒ 空则用原名，别让它变成空输入。
          if [ -z "$VC_BASE" ]; then VC_BASE="$BASE_VERSION"; fi
          DEV_VERSION_CODE="$(printf '%s' "$VC_BASE" | awk -F. '
            function isnum(s) { return s ~ /^[+-]?[0-9]+$/ }
            {
              if (!isnum($1) || !isnum($2)) { print 1; exit }
              maj = $1 + 0; min = $2 + 0
              pat = (NF >= 3 && isnum($3)) ? $3 + 0 : 0
              if (maj < 0 || min < 0 || pat < 0) { print 1; exit }
              print maj * 1000000 + min * 1000 + pat
            }')"
          if [ -z "$DEV_VERSION_CODE" ]; then DEV_VERSION_CODE=1; fi
          {
            echo "version_name=$DEV_VERSION_NAME"
            echo "version_code=$DEV_VERSION_CODE"
            echo "base_version=$BASE_VERSION"
            echo "short_sha=$(echo ${GITHUB_SHA} | cut -c1-7)"
          } > "$GITHUB_WORKSPACE/dev-build-info.env"
          echo "Debug versionName=$DEV_VERSION_NAME versionCode=$DEV_VERSION_CODE"
          ./gradlew :app:assembleFullDebug --stacktrace \
            -PversionName="$DEV_VERSION_NAME" $KS_OPTS 2>&1 | tee /tmp/build_log.txt
          BUILD_EXIT=${PIPESTATUS[0]}
          if [ "$BUILD_EXIT" -ne 0 ]; then
            echo "::notice title=Build gate diagnostics::build_failed=true"
            grep -E "^e: |error:|FAILURE|Caused by:|Could not|What went wrong|BUILD FAILED" /tmp/build_log.txt | head -40 | while IFS= read -r line; do
              echo "::notice title=build_gate::$line"
            done
            exit "$BUILD_EXIT"
          fi
          echo "::notice title=Build gate diagnostics::build_failed=false"
        env:
          # ⚠️ 2026-11-01 二次踩坑：**Secrets 不会自动变成环境变量**（同一句教训 2026-09-08 已经
          #    在 `Decode signing keystore` 上写过一遍，这里又漏了）。缺这三行的后果是：
          #    本步骤里 `${SIGNING_STORE_PASSWORD}` 恒为空 ⇒ 全部回落 `android`
          #    ⇒ `keytool -certreq` 必然失败 ⇒ **CI #341 打出一条假的**
          #    `Keystore store password wrong`，而 Decode 那步（有 env）明明报「解码通过」。
          #    两句日志互相矛盾，人只会更糊涂 —— #218.1 想修的正是这种症状。
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}

      # ★ 2026-11-01：**把编译错误的原文打到 annotation 上**。
      #
      # 事故：CI #332/#333/#334 三次连续红，而所有可见信息只有
      #   「1 error … Process completed with exit code 1.」
      # 加上一句 `Build gate diagnostics::build_failed=false` —— 后者看起来像
      # 「编译没失败」，**实际编译失败了**（它只反映它自己那次 gradlew 的退出码，
      # 而这一步失败发生在别处）。完整编译日志在 /tmp/build_log.txt，step 一结束就没了；
      # artifact 里也没有它。⇒ 只能靠猜，猜了两次都没中。
      #
      # 这一步 `if: always()`，读那份日志并把 `e: ` / `error:` 打出来。
      # 「日志只在 step 内存在」＝ 失败时等于没有日志，凡是失败诊断都必须是独立 step。
      - name: Summarize build errors
        if: always()
        shell: bash
        # 同上：纯报告步骤，不允许失败。
        continue-on-error: true
        run: |
          set -uo pipefail
          LOG=/tmp/build_log.txt
          if [ ! -s "$LOG" ]; then
            echo "::notice title=build errors::未找到构建日志（构建步骤可能未执行）"
            exit 0
          fi
          hits="$(grep -nE "^e: |^w: .*deprecat|error:|FAILURE:|What went wrong|Caused by:|Unresolved reference|Type mismatch" "$LOG" | head -60 || true)"
          if [ -z "$hits" ]; then
            echo "::notice title=build errors::日志里没有匹配的错误行"
            exit 0
          fi
          echo "::notice title=build errors::命中 $(printf '%s\n' "$hits" | wc -l | tr -d ' ') 行（最多 60）"
          printf '%s\n' "$hits" | while IFS= read -r line; do
            echo "::notice title=compile_error::${line}"
          done
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}

      - name: List debug APK outputs
        run: find app/build/outputs/apk/*/debug -maxdepth 1 -type f -print || true

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: debug-apk
          path: |
            app/build/outputs/apk/*/debug/*.apk
            app/build/outputs/apk/*/debug/*.APK
          if-no-files-found: error
          retention-days: 3

      - name: Collect debug APK metadata
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: apk_meta
        shell: bash
        run: |
          # 从 apk 根目录统一查找而不 `cd app/build/outputs/apk/*/debug`：早期多 flavor 下
          # 通配符会展开成多个目录导致 "cd: too many arguments"（现只出 full 单包，
          # 但保留这种写法，恢复 offline 时无需再改）。
          apk_root="app/build/outputs/apk"
          apk_list="$(find "$apk_root" -type f \( -iname '*.apk' -o -iname '*.APK' \) -printf '%P\n' | sort)"
          apk_count="$(printf '%s\n' "$apk_list" | sed '/^$/d' | wc -l | tr -d ' ')"
          if [ "$apk_count" = "0" ]; then
            echo "No debug APK found under $apk_root"
            find "$apk_root" -maxdepth 3 2>/dev/null || true
            exit 1
          fi

          # ---- 版本字段：只读构建步骤落盘的那份（口径见 Build Debug APK 步骤）----
          info_env="$GITHUB_WORKSPACE/dev-build-info.env"
          version_name=""; version_code=""; base_version=""; short_sha=""
          if [ -f "$info_env" ]; then
            # shellcheck disable=SC1090
            . "$info_env"
            version_name="${version_name:-}"; version_code="${version_code:-}"
            base_version="${base_version:-}"; short_sha="${short_sha:-}"
          fi
          if [ -z "$version_name" ]; then
            # 兜底：落盘文件没生成（理论上不该发生）。**不要**在这里重算一遍拼法 ——
            # 重算 = 第二处来源，正是要避免的东西；只退化成一个明确"未知"的占位。
            echo "::warning title=version unknown::$info_env 缺失，Release 标题里的版本号将显示为 unknown"
            version_name="unknown"; base_version="0.0.0"
            short_sha="$(echo "${GITHUB_SHA}" | cut -c1-7)"
          fi
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
          echo "base_version=$base_version" >> "$GITHUB_OUTPUT"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"

          # ---- 签名信息（**如实**取自产出的 APK，不取自 Secrets / 不取自日志措辞）----
          # 这一段解决的是一类具体事故：CI 某次降级成一次性密钥，包里照旧写着
          # `固定密钥解码通过`，用户装上却「盖不上上一版」。事后只能靠人去翻日志推理。
          # ⇒ 把「这个包实际是谁签的」直接印在 Release 页上：一次 eye-check 即可判定。
          apk0="$(printf '%s\n' "$apk_list" | sed '/^$/d' | head -1)"
          signer=""
          # ⚠️ 2026-11-01 实测教训（两次踩同一件事）：
          #    ① `apksigner` **不在 runner 的 PATH 上**（在 `$ANDROID_SDK_ROOT/build-tools/<ver>/`），
          #       第一版 `command -v apksigner` 恒假；
          #    ② 当时的兜底读 `META-INF/*.RSA` 也读不到 —— debug 包用 **v2 签名**，
          #       证书在 APK Signing Block 里，`META-INF/` 下根本没有 `.RSA`。
          #    两条路都落空 ⇒ 页面印出「未能读取」。**"有兜底"不等于"兜底能兜住"。**
          # ⇒ 现在 v2 解析器独立成 `.ai/tools/read_apk_signer.py`，并有自检
          #   `selftest_apk_signer.py` 守着（造样本 → 断言指纹与证书 SHA-256 相等）。
          apksigner_bin="$(command -v apksigner 2>/dev/null || true)"
          if [ -z "$apksigner_bin" ]; then
            # 按版本号从高到低找（`sort -V`），取第一个可执行的。
            apksigner_bin="$(ls -1 "${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"/build-tools/*/apksigner 2>/dev/null \
              | sort -V -r | head -1 || true)"
          fi
          fingerprint=""
          subject=""
          if [ -n "$apk0" ] && [ -x "${apksigner_bin:-/nonexistent}" ]; then
            echo "::notice title=apksigner::$apksigner_bin"
            # ⚠️ 2026-11-01 实测（CI #341）：apksigner 找到了、也执行了，但**输出一个字节都没有**。
            #    原因是 `2>/dev/null` 把所有解释都吞了 —— 「工具在位」≠「工具能用」。
            #    ⇒ 为了下一次不用再猜：失败时把它的 stderr 前几行打成 annotation。
            signer="$("$apksigner_bin" verify --print-certs "$apk_root/$apk0" 2>/tmp/apksig.err | head -1 || true)"
            if [ -z "$signer" ]; then
              reason="$(head -3 /tmp/apksig.err 2>/dev/null | tr '\n' ' ' | cut -c1-300)"
              echo "::warning title=apksigner gave no output::${apksigner_bin} 执行了但没有输出。stderr：${reason:-<空>}"
            fi
            fingerprint="$(printf '%s' "$signer" | sed -nE 's/.*SHA-256 digest:[[:space:]]*([0-9a-fA-F]+).*/\1/p' | head -1)"
            subject="$(printf '%s' "$signer" | sed -nE 's/.*DN: *(.*)$/\1/p' | head -1)"
          fi
          if [ -z "$fingerprint" ] && [ -n "$apk0" ]; then
            # 兜底：自己解 v2/v3 签名块（apksigner 确实不存在时才走这条）。
            parsed="$(python3 "$GITHUB_WORKSPACE/.ai/tools/read_apk_signer.py" "$apk_root/$apk0" 2>/tmp/readsigner.err || true)"
            fingerprint="${parsed%%|*}"
            subject="${parsed#*|}"
            if [ -z "$fingerprint" ]; then
              err="$(head -3 /tmp/readsigner.err 2>/dev/null | tr '\n' ' ' | cut -c1-300)"
              echo "::warning title=v2 parser gave nothing::$apk0 里没有可解析的 v2/v3 签名块。stderr：${err:-<空>}"
            fi
          fi
          if [ -n "$fingerprint" ]; then
            echo "signer_fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
            echo "signer_subject=${subject:-unknown}" >> "$GITHUB_OUTPUT"
            echo "::notice title=APK signer::SHA-256=$fingerprint DN=${subject:-unknown}"
          else
            echo "::warning title=APK signer unreadable::未能从 APK 读出签名证书，Release 页将显示「未能读取」"
            echo "signer_fingerprint=" >> "$GITHUB_OUTPUT"
            echo "signer_subject=unknown" >> "$GITHUB_OUTPUT"
          fi

          # 展示成「文件名 → 大小」的列表而不是 `> * \`路径\``：
          #   · 路径前几段（`full/debug/`）对下载的人没有意义，反而把有用的文件名挤到后面；
          #   · 给上体积，能一眼看出这次产物是不是正常大小（构建半残时常有明显偏差）。
          apk_markdown="$(cd "$apk_root" && printf '%s\n' "$apk_list" | sed '/^$/d' | while IFS= read -r f; do
            sz="$(stat -c%s "$f" 2>/dev/null || echo 0)"
            printf -- '- `%s` — %s MB\n' "$(basename "$f")" "$(awk -v b="$sz" 'BEGIN{printf "%.1f", b/1048576}')"
          done)"
          echo "apk_count=${apk_count}" >> "$GITHUB_OUTPUT"
          {
            echo "apk_list<<EOF"
            printf '%s\n' "$apk_markdown"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Cleanup previous preview release (assets + release + tag)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          release_id="$(gh api repos/${{ github.repository }}/releases/tags/preview --jq '.id' 2>/dev/null || true)"
          if [[ "$release_id" =~ ^[0-9]+$ ]]; then
            echo "Deleting existing preview release id=${release_id}"
            gh api -X DELETE repos/${{ github.repository }}/releases/${release_id} 2>/dev/null || true
          else
            echo "No existing preview release to delete"
          fi
          gh api -X DELETE repos/${{ github.repository }}/git/refs/tags/preview 2>/dev/null || true
          echo "Cleanup done"

      # ★ 2026-11-01：预览版文案重写。改动理由（用户 2026-11-01 反馈）：
      #
      #  ① 标题里是**一长串 commit SHA**：`⚠️ Development Preview (dev-341be3a58fb…)`，
      #     在 Releases 列表里被截断，看不出是哪个版本 —— 而这是用户唯一能看到的身份。
      #     ⇒ 换成 `Vaultix v0.10.4-dev-341be3a`：与包里 `versionName`、与设置页显示
      #       三者同源（`.ai/ISSUES.md` #145.1 的承诺），SHA 只留 7 位可读形式。
      #       ⚠️ 分隔符必须是 `-`（不是 `+`）：`+` 在语义化版本里是 build metadata，
      #         `+` 之后的东西**不参与版本比较**；而这里 SHA 恰恰是区分先后的一部分。
      #         也与 `PackageManager` 解析/显示的行为保持一致（它会把 versionName 原样给出）。
      #  ② 正文里「Debug APK」「debug 构建产物」「Generated APKs」三处说的是同一件事，
      #     还挤在一段 blockquote 里。⇒ 压成：一行定位 + 一张构建信息表 + APK 清单。
      #  ③ 新增**签名指纹**。这是本轮真实发生的事故：某次 CI 用一次性密钥签了包，
      #     用户装上提示「与上一版签名不一致」，而页面上没有任何可自查的依据。
      #     指纹印出来以后，这类问题不用再靠读 CI 日志推理。
      #
      # ⚠️ 标题前缀沿用 ⚠️ 是有意的：Releases 列表里 prerelease 的 `Pre-release`
      #    徽标与 Stable 并排时不够显眼，而"这是能装的、但不是正式版"这件事
      #    值得一个能在页面上立刻看到的位置。正文里不再重复第二遍。
      - name: Publish Debug APK to preview Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: preview
          target_commitish: ${{ github.sha }}
          name: "Vaultix v${{ steps.apk_meta.outputs.version_name }} · Preview"
          body: |
            **开发预览** · 每次 push 到 `main` 自动构建，用于抢先体验新功能。日常使用请装 [Stable 版本](https://github.com/${{ github.repository }}/releases/latest)。

            | 项目 | 值 |
            |---|---|
            | 版本 | `${{ steps.apk_meta.outputs.version_name }}`（versionCode `${{ steps.apk_meta.outputs.version_code }}`） |
            | 提交 | [`${{ steps.apk_meta.outputs.short_sha }}`](https://github.com/${{ github.repository }}/commit/${{ github.sha }}) |
            | 构建 | `debug`（未混淆，可调试；性能与正式版不同） |
            | 签名 | `${{ steps.apk_meta.outputs.signer_subject }}`<br/>SHA-256 `${{ steps.apk_meta.outputs.signer_fingerprint || '未能读取' }}` |

            **下载**

            ${{ steps.apk_meta.outputs.apk_list }}

            > 与上一个预览包**签名一致**时可直接覆盖安装（保留数据与指纹解锁）；若提示签名不一致，说明这次的签名密钥变了 —— 安装前请先导出备份。
          # ⚠️ `files` 必须与 `body` **同级**（10 空格），且绝不能粘在 body 最后一行末尾 ——
          #    粘上去 YAML 依然合法（只是正文多了几个字），但 `with.files` 这个键**不存在**，
          #    action 会安静地建一个 0 附件的 release 并返回成功（#221）。
          files: |
            app/build/outputs/apk/*/debug/*.apk
            app/build/outputs/apk/*/debug/*.APK
          # ★ #221：glob 匹配不到就当场红，别安静地发个 0 附件 Release。
          fail_on_unmatched_files: true
          draft: false
          prerelease: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ★ 2026-10-10：从「报告模式」升为**真门禁**（去掉 `continue-on-error`）。
      #
      # 为什么现在敢去掉：本步骤此前长期 `continue-on-error: true` ⇒ **单测失败 CI 仍绿**。
      # 配合上一条 upload 步骤的路径错配（只收集了 data:kdbx 的报告），出现过这样的状态：
      # 「顶层结论绿 · 日志里躺着 30 条 Unresolved reference · 实际跑了什么没人知道」。
      # 那正是"CI 绿 ≠ 单测通过"的完整成因，也是本轮一批修复能潜伏至今的土壤。
      #
      # 现在按「单测是硬门禁」的常规做法取值：**失败即红**。
      # ⚠️ 若是因为基础设施（Gradle 下载失败 / 缓存损坏）而非断言失败导致红，
      #    请修基础设施本身，**不要**把这个 `continue-on-error` 加回来 ——
      #    那等于重新把门禁关上（加回时请一并说明理由与恢复计划，同下方 lint 的处置方式）。
      - name: Run unit tests (hard gate)
        id: unit_tests
        # 同 lint：多 flavor 下 `testDebugUnitTest` 亦有歧义，需显式指定 variant。
        # 纳入全部含单测的模块：core:crypto（172 例，Kover 门禁 ≥80%）、
        # core:common（TOTP/密码强度等纯算法 16 例）、core:model（关联字段
        # linkedId 分段编码锁定 5 例）、data:repository（会话/条目写路径）、
        # data:bitwarden（CipherMapper 载荷保真/类型守恒 28 例）、
        # data:kdbx（★ 2026-09-17 补：KDBX 读/写路径往返保真 + KPEX_* 字段，
        #   含 KdbxWritePathTest 的 9 例。**此前漏登记 ⇒ 这些用例从未真正执行过**）。
        # ★ 2026-10-10 补 core:datastore（VaultTimeout 档位模型 + 旧档位迁移映射，
        #   VaultTimeoutTest / VaultTimeoutScopeTest 共 18 例）—— 与 data:kdbx 同一种漏法：
        #   模块有 `test` 源码集、`build.gradle.kts` 也有 junit+truth 依赖，
        #   只是没人把它写进这条命令，于是**从未在 CI 跑过**。
        # ★ 2026-10-27 补 :domain（#199 起该模块有了第一个测试：FolderNamePolicyTest 6 例）。
        #   与 data:kdbx / core:datastore 同一种漏法 —— 模块新增 `src/test` 时最容易忘的就是这里。
        #   查漏方法（别再靠眼睛扫）：把各模块 `src/test` 的文件数与这条命令对一遍。
        # 此前只跑 :app 与部分模块，新模块的测试等于从未在 CI 真正执行（盲区）。
        # ⚠️ 新增带单测的模块时，**必须同时加进这里**，否则测试等于不存在。
        # ★ 2026-11-01：**把退出码打出来再判**。
        #
        # 事故：CI #336/#337 的结论是「共 915 例，失败 0 例」，但整条 CI 仍是红的，
        # 锚点却落在报告步骤上。这里有一个**没人能回答的问题**：
        # 「`testDebugUnitTest` 到底返回了什么？」
        # 之前无法回答，是因为 Gradle 的退出码只在 runner 里存在，日志要认证才能下载。
        # ⇒ 用 `PIPESTATUS` 抓真实退出码，并同时 grep 出测试 JVM 崩溃 / OOM 的痕迹。
        #   这样下一次红的时候，"是断言挂还是进程挂"一眼可判。
        shell: bash
        run: |
          set +e
          ./gradlew :core:crypto:testDebugUnitTest :core:common:testDebugUnitTest \
            :core:model:testDebugUnitTest :core:datastore:testDebugUnitTest \
            :app:testFullDebugUnitTest :data:repository:testDebugUnitTest \
            :data:bitwarden:testDebugUnitTest :data:kdbx:testDebugUnitTest \
            :domain:testDebugUnitTest \
            --continue --stacktrace 2>&1 | tee /tmp/test_log.txt
          TEST_EXIT=${PIPESTATUS[0]}
          echo "::notice title=unit test exit::gradlew 退出码 = ${TEST_EXIT}"
          # 测试进程崩溃（不是断言失败）的典型痕迹：
          # ⚠️ 必须包含 `^e: `（Kotlin 编译错误）—— 2026-11-01 实测：那一次红的真因是
          #   `> Task :app:compileFullDebugUnitTestKotlin FAILED`（**测试源码编译失败**），
          #   而第一版 grep 只找了崩溃/OOM 关键词，把真正那行 `e:` 漏在外面，
          #   还得再跑一轮才看到。**grep 的关键词表本身就是一种判据，漏一个 = 再猜一次。**
          grep -nE "^e: |OutOfMemoryError|Process 'Gradle Test Executor|Test worker.*crashed|Could not complete execution|There were failing tests|FAILED" \
            /tmp/test_log.txt | head -30 | while IFS= read -r line; do
              echo "::notice title=test_log::${line}"
            done
          exit "$TEST_EXIT"

      # 失败用例名转 annotation（2026-10-30 加）。
      #
      # ⚠️ 为什么需要这一步：`Run unit tests` 挂了之后，**顶层 annotation 只有一句
      #    "Process completed with exit code 1."** —— 失败用例名、断言差异、异常栈
      #    全在 artifact 的 XML 里，而 artifact 下载**需要认证**（匿名 401）。
      #    结果是：CI 红了但任何人在本地都拿不到"哪个用例红了"，只能靠猜着改。
      #    这不是第一次 —— #199/#203 那几轮也是靠反复 push 试探。
      #
      # 把 `<testcase>` 里带 `<failure>` 的项直接打成 notice，日志页一眼能看到
      # 「类名.用例名 + 第一行错误」。只取前 40 条：Gradle 一次挂几十个用例时，
      # 后面的基本都是同一个根因的连带失败，读前 40 条足够定位。
      - name: Summarize failed unit tests
        if: always()
        shell: bash
        # ⚠️ 2026-11-01：本步骤**只做报告，不允许失败**。
        #    事故：CI #336 里它把 `Process completed with exit code 1` 挂在了自己身上，
        #    而它报的内容是「共 915 例，失败 0 例」—— 一个纯读取步骤，硬是把整条 CI 判红。
        #    本地按同样脚本复现（无 XML / 有 XML）都 exit 0，说明成因在 runner 侧的
        #    输出处理（`::notice::` 逐行输出 + 内容里的特殊字符）。
        #    ⇒ 诊断步骤的职责是**提供信息**，不是**下判决**。它一旦能失败，
        #      就会把"真正的失败"替换成"诊断器自己坏了"，这正是这一轮连环红的最后一段。
        #    真正的门禁是上一步 `Run unit tests (hard gate)`，那一步该红就红。
        continue-on-error: true
        run: |
          set -uo pipefail
          python3 - <<'PY' || true
          import glob, sys, xml.etree.ElementTree as ET

          files = glob.glob('**/build/test-results/**/TEST-*.xml', recursive=True)
          if not files:
              print('::notice title=unit tests::未找到 test-results XML')
              sys.exit(0)

          failed = []
          total = 0
          for path in files:
              try:
                  root = ET.parse(path).getroot()
              except Exception as exc:          # noqa: BLE001 - 报告损坏不该让门禁崩
                  print(f'::notice title=unit tests::无法解析 {path}: {exc}')
                  continue
              for case in root.iter('testcase'):
                  total += 1
                  node = case.find('failure')
                  if node is None:
                      node = case.find('error')
                  if node is None:
                      continue
                  cls = case.get('classname') or ''
                  name = case.get('name') or ''
                  head = (node.get('message') or node.text or '').strip().splitlines()
                  first = head[0][:220] if head else '(无消息)'
                  failed.append(f'{cls}.{name} → {first}')

          print(f'::notice title=unit tests::共 {total} 例，失败 {len(failed)} 例')
          for line in failed[:40]:
              # notice 的消息里不能有裸换行，压成一行。
              print('::notice title=failed test::' + line.replace('\n', ' '))
          if len(failed) > 40:
              print(f'::notice title=unit tests::其余 {len(failed) - 40} 例省略（多为同一根因）')
          PY

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: debug-unit-test-reports
          # ⚠️ 2026-10-05 修正两处长期错配（此前**只有 data:kdbx 的报告被上传过**）：
          #   ① app 有 `full` / `offline` 两个 flavor，跑的是 `testFullDebugUnitTest`，
          #      而路径写的是 `testDebugUnitTest` ⇒ app 的 35 个测试类（含
          #      VaultixBrandColorTest / AvatarHueTest）的报告**从未被收集过**。
          #      同文件上方的 `lint` 步骤早就踩过这个坑并改成了 `lintFullDebug`，
          #      唯独这里漏了。
          #   ② core:* / data:repository / data:bitwarden 同样在跑测试，但路径里没有它们。
          # ⇒ 后果是"CI 绿"完全不能代表单测通过。核对单测必须看本产物，不能只看顶层结论。
          #    同 lint 的理由：`testDebugUnitTest` 在多 flavor 下有歧义，需显式指定 variant。
          #
          # ⚠️ 2026-10-10：又补了 core:datastore。**这条路径清单必须与上面的测试命令逐项对齐** ——
          #    两处不一致时，缺的那一项就是"在跑但报告没人收"，核对时会看着像没跑过。
          #    改上面命令时，请一并改这里。
          path: |
            app/build/reports/tests/testFullDebugUnitTest
            app/build/test-results/testFullDebugUnitTest
            core/crypto/build/reports/tests/testDebugUnitTest
            core/crypto/build/test-results/testDebugUnitTest
            core/common/build/reports/tests/testDebugUnitTest
            core/common/build/test-results/testDebugUnitTest
            core/model/build/reports/tests/testDebugUnitTest
            core/model/build/test-results/testDebugUnitTest
            core/datastore/build/reports/tests/testDebugUnitTest
            core/datastore/build/test-results/testDebugUnitTest
            data/repository/build/reports/tests/testDebugUnitTest
            data/repository/build/test-results/testDebugUnitTest
            data/bitwarden/build/reports/tests/testDebugUnitTest
            data/bitwarden/build/test-results/testDebugUnitTest
            data/kdbx/build/reports/tests/testDebugUnitTest
            data/kdbx/build/test-results/testDebugUnitTest
            domain/build/reports/tests/testDebugUnitTest
            domain/build/test-results/testDebugUnitTest
          if-no-files-found: ignore
          retention-days: 3
