[versions]
# ===== 构建工具链：与 Bastion 对齐 =====
# AGP 9.3.2 要求最低 Gradle 9.5.0（见 gradle-wrapper.properties，取 9.5.1）。
agp = "9.3.2"
# Kotlin 停在 2.3.21。升 2.4.x 会被 KSP 阻塞：KSP 至今只发到 2.3.11，
# 没有 2.4.x，Room 编译器跑不起来。待 KSP 2.4 发布后再动。
# Kotlin 2.4.10（当前最新稳定版）。
# 注：Bastion 的注释称「升 2.4.x 会被 KSP 阻塞」，实测该结论已过时。
#     2026-09-07 实测：Kotlin 2.4.10 + KSP 2.3.11 组合下，
#     :app:kspFullDebugKotlin（Hilt 注解处理）与 :app:compileFullDebugKotlin 均通过。
#     原因：KSP 采用独立版本线（2.3.x 可支持 Kotlin 2.4.x），并非与 Kotlin 一一对应。
kotlin = "2.4.10"
ksp = "2.3.11"

# ===== Compose =====
# ⚠️ composeBom 与 material3 是【硬绑定】，禁止只升级其中一个。
# 版本依赖链（Bastion 实测）：
#   bom 2026.03.00 锁 runtime/foundation/ui = 1.10.5
#   material3 1.5.0-alpha16 依赖               1.11.0-beta02
# 若只升 bom 而 material3 留在 alpha16，解析结果会是 1.12.0，而 alpha16 的字节码
# 是针对 1.11.0-beta02 编译的 —— 跨 minor 属二进制不兼容（NoSuchMethodError 风险）。
# 二者组合直接对齐 Bastion，便于后续搬运其 Compose 组件。
composeBom = "2026.03.00"
# 刻意保留 alpha16：alpha27 会引发 70 处编译失败（menuAnchor() 无参重载被移除、
# ExposedDropdownMenu 引用失效），属业务代码改造而非版本切换，需单独立项。
material3 = "1.5.0-alpha16"

coreKtx = "1.19.0"
lifecycle = "2.11.0"
activityCompose = "1.13.0"
navigationCompose = "2.10.0"
# ⚠️ Hilt 与 Kotlin 强绑定：Hilt 内置的 kotlin-metadata-jvm 决定了能解析的 metadata 版本。
#    官方对应：Kotlin 2.4.10 → Hilt 2.60.1（KSP 2.3.10）；Kotlin 2.3.21 → Hilt 2.59.2。
#    实测：Kotlin 2.4.10 + Hilt 2.59 会报
#    "[Hilt] Provided Metadata instance has version 2.4.0, while maximum supported version is 2.3.0"。
#    另：Hilt < 2.59 在 AGP 9 下会抛 "Android BaseExtension not found"（旧 DSL 已被 newDsl 移除）。
hilt = "2.60.1"
hiltNavigationCompose = "1.2.0"
room = "2.8.4"
datastore = "1.2.1"
securityCrypto = "1.1.0"
coroutines = "1.11.0"
collectionsImmutable = "0.3.8"
kotlinxSerializationJson = "1.11.0"
kotlinxDatetime = "0.6.2"
coil = "2.7.0"
# 稳定版 1.1.0 比 alpha 线更旧；alpha 线跨 2 个 minor 风险不划算（Bastion 同策略）
biometric = "1.2.0-alpha05"
# 锁 1.3.0：1.6.0 把 callingAppInfo.origin 收紧为 internal，读它做来源校验会编译失败
credential = "1.3.0"
workManager = "2.11.2"

# ---- 网络层（data:bitwarden）----
# Retrofit 与 OkHttp 成对维护，避免 converter 与 OkHttp 主版本不匹配。
retrofit = "2.11.0"
okhttp = "4.12.0"
retrofitSerialization = "1.0.0"

# ===== core:crypto 依赖版本 =====
# Argon2id native 实现。锁 1.6.0（与 Bastion 完全一致）：
#   1) 1.6.0 提供 Argon2KtResult.rawHashAsByteArray() / rawHash / encodedOutput，
#      BitwardenCrypto 的直接缓冲区清零逻辑依赖这些成员；
#   2) 内置 arm64-v8a / armeabi-v7a / x86 / x86_64 四种 .so，覆盖 minSdk 26 全部 ABI；
#   3) 上游无更高稳定版，1.6.0 即当前最新，不存在升级收益。
argon2kt = "1.6.0"
# BouncyCastle 提供者。锁 1.85.2（与 Bastion 完全一致），选 jdk18on 而非 jdk15to18：
#   - jdk18on 面向 JDK 1.8+，是 BC 当前唯一的活跃主线，AGP 9 / JDK 17 下无反射警告；
#   - 需要它做两件事：PBKDF2-SHA256（PKCS5S2ParametersGenerator 直接吃原始字节 seed，
#     绕开 JCE PBEKeySpec 必须 char[] 的限制 —— MasterKey 是任意二进制，不能转 char[]），
#     以及 Argon2id 的 JVM 回退（Argon2BytesGenerator）。
bcprov = "1.85.2"

junit = "4.13.2"
truth = "1.4.4"
turbine = "1.2.0"
mockk = "1.14.11"
# Kover：行覆盖率工具。选 0.9.9（当前最新稳定版）：
#   - 0.9.x 是唯一同时提供 Android 变体报告（koverHtmlReportDebug / koverVerifyDebug）
#     与 JVM 字节码插桩的线，0.7.x 在 AGP 9 下拿不到 Kotlin 编译产物；
#   - 0.9.x 把 Kover 版本与 KGP 版本解耦（插件只依赖 Gradle API + 编译产物目录），
#     因此可配合 Kotlin 2.4.10 + AGP 9 内置 Kotlin 使用；
#   - 与 JaCoCo 不混用：AGP 9 内置 Kotlin 下 JaCoCo 无法插桩 Kotlin 内联函数。
kover = "0.9.9"

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
# android-library 此前缺失，导致 core/*/data/*/domain 子模块无法解析 libs.plugins.android.library
android-library = { id = "com.android.library", version.ref = "agp" }
# ⚠️ AGP 9 起内置 Kotlin（默认 2.2.10），禁止 apply org.jetbrains.kotlin.android：
#    会与内置 kotlin 扩展冲突（Cannot add extension with name 'kotlin'），故不再提供该别名。
# kgp：仅把 KGP 2.3.21 带上 build classpath 以覆盖 AGP 内置版本，只在根工程 apply false。
# 别名刻意避开 "kotlin-" 前缀：Gradle 9 的 plugins 块中 "kotlin" 会与内置 kotlin {} DSL
# 撞名，导致 libs.plugins.kotlin.jvm 被误解析为 ToolchainManagement.jvm。
kgp = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
# kotlin-serialization 此前缺失，core:model 依赖它做 @Serializable
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
# Kover 覆盖率插件。与根工程其它插件一致，只在根声明 apply false，由模块按需应用。
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-process = { group = "androidx.lifecycle", name = "lifecycle-process", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
# 显式锁版本（跟随 Bastion）：composeBom 与 material3 硬绑定，不可只改其一
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "material3" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hiltNavigationCompose" }
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
hilt-android-testing = { group = "com.google.dagger", name = "hilt-android-testing", version.ref = "hilt" }
androidx-datastore = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
androidx-biometric = { group = "androidx.biometric", name = "biometric", version.ref = "biometric" }
androidx-security-crypto = { group = "androidx.security", name = "security-crypto", version.ref = "securityCrypto" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-collections-immutable = { group = "org.jetbrains.kotlinx", name = "kotlinx-collections-immutable", version.ref = "collectionsImmutable" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }
kotlinx-datetime = { group = "org.jetbrains.kotlinx", name = "kotlinx-datetime", version.ref = "kotlinxDatetime" }
coil-compose = { group = "io.coil-kt", name = "coil-compose", version.ref = "coil" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
truth = { group = "com.google.truth", name = "truth", version.ref = "truth" }
turbine = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine" }
mockk = { group = "io.mockk", name = "mockk", version.ref = "mockk" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version = "1.2.1" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version = "3.6.1" }

# ---- 持久化与后台任务（此前仅在 [versions] 声明、[libraries] 缺失，导致无法引用）----
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "workManager" }

# ---- 网络层（data:bitwarden）----
retrofit-core = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-kotlinx-serialization = { group = "com.jakewharton.retrofit", name = "retrofit2-kotlinx-serialization-converter", version.ref = "retrofitSerialization" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-logging-interceptor = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }
androidx-credentials = { group = "androidx.credentials", name = "credentials", version.ref = "credential" }

# ---- core:crypto ----
# Argon2id native 实现（Bitwarden KdfType=1 首选 KDF）
argon2kt = { group = "com.lambdapioneer.argon2kt", name = "argon2kt", version.ref = "argon2kt" }
# BouncyCastle：PBKDF2-SHA256 原始字节派生 + Argon2id JVM 回退
bcprov-jdk18on = { group = "org.bouncycastle", name = "bcprov-jdk18on", version.ref = "bcprov" }
# core:crypto 刻意依赖 -core 而非 -android：模块内不含 android.* 调用，
# 依赖 -android 会把 Android 平台分发器带进纯 JVM 单元测试环境。
# （-android 本身也传递依赖 -core，二者共存不会产生类冲突。）
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
